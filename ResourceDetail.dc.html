<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Manrope',system-ui,sans-serif;color:#e2e8f0}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}
  .mono{font-family:'JetBrains Mono',monospace}
</style>
</helmet>

<dc-import name="Header" active="recursos" cart-count="2" hint-size="100%,64px"></dc-import>

<div style="max-width:1000px;margin:0 auto;padding:36px 40px 72px">
  <div class="mono" style="font-size:12px;color:#8fa9a0;margin-bottom:20px">
    <a href="Resources.dc.html" style="color:#8fa9a0;text-decoration:none">Recursos</a> / <span style="color:#e2e8f0">{{ resource.name }}</span>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center">
    <div>
      <span class="mono" style="width:fit-content;display:inline-block;font-size:10px;background:rgba(110,231,183,.12);color:#6ee7b7;padding:3px 8px;border-radius:3px;margin-bottom:14px">GRATIS · SIN COSTO</span>
      <h1 style="font-size:26px;font-weight:800;margin:0 0 12px;letter-spacing:-.3px">{{ resource.name }}</h1>
      <p style="font-size:14.5px;color:#b7cfc6;line-height:1.6;margin:0 0 22px">{{ resource.desc }}</p>
      <div class="mono" style="font-size:11.5px;color:#8fa9a0;margin-bottom:22px">.xlsx sin macros · Español · Compatible con Excel y Excel Web</div>
      <a href="{{ resource.signupHref }}" style="text-decoration:none;display:inline-block;padding:14px 26px;background:#ff7a45;color:#241008;border-radius:6px;font-weight:700;font-size:14px">Descargar gratis</a>
    </div>
    <div style="height:280px;overflow:hidden;border:1px solid rgba(110,231,183,.14);border-radius:8px">
      <img src="{{ resource.cover }}" alt="{{ resource.name }}" style="width:100%;height:100%;object-fit:cover"/>
    </div>
  </div>
</div>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
const RESOURCES = {
  checklist: { id: 'checklist', name: 'Checklist para consulta nutricional', desc: 'Lista de verificación para preparar y estructurar una sesión de consulta, en formato Excel Lab simplificado.', cover: 'assets/img/covers/checklist-consulta.png' },
  demo: { id: 'demo', name: 'Plantilla gratuita de ejemplo', desc: 'Vista simplificada del formato Excel Lab, con datos ya calculados para que compruebes el estándar antes de comprar.', cover: 'assets/img/covers/excel-lab-demo.png' }
};

class Component extends DCLogic {
  renderVals() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'checklist';
    const resource = RESOURCES[id] || RESOURCES.checklist;
    return { resource: { ...resource, signupHref: 'ResourceSignup.dc.html?id=' + resource.id } };
  }
}

</script>
</body>
</html>
