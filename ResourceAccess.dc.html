<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Manrope',system-ui,sans-serif;color:#e2e8f0}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}
  .mono{font-family:'JetBrains Mono',monospace}
</style>
</helmet>

<dc-import name="Header" active="recursos" cart-count="2" hint-size="100%,64px"></dc-import>

<div style="max-width:560px;margin:0 auto;padding:64px 40px 96px;text-align:center">
  <div style="width:56px;height:56px;border-radius:50%;background:rgba(110,231,183,.12);color:#6ee7b7;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin:0 auto 18px">✓</div>
  <h1 style="font-size:24px;font-weight:800;margin:0 0 10px;letter-spacing:-.3px">Acceso confirmado</h1>
  <p style="font-size:14px;color:#9fb8ae;margin:0 0 28px">Tu recurso gratuito ya está disponible para descargar.</p>
  <div style="border:1px solid rgba(110,231,183,.16);border-radius:8px;padding:18px;display:flex;align-items:center;gap:16px;text-align:left;margin-bottom:28px">
    <div style="width:52px;height:40px;flex:none;border-radius:5px;overflow:hidden"><img src="{{ resource.cover }}" alt="{{ resource.name }}" style="width:100%;height:100%;object-fit:cover"/></div>
    <div style="flex:1"><div style="font-weight:800;font-size:14px">{{ resource.name }}</div><div class="mono" style="font-size:11px;color:#7fa398">.xlsx sin macros</div></div>
    <a href="{{ resource.file }}" download style="text-decoration:none;font-size:12px;font-weight:700;padding:9px 16px;background:#6ee7b7;color:#04140f;border-radius:5px;cursor:pointer">Descargar</a>
  </div>
  <div style="background:rgba(255,255,255,.035);border:1px solid rgba(110,231,183,.14);border-radius:6px;padding:12px 16px;font-size:12px;color:#c7dad2;margin-bottom:28px">
    También enviaremos el enlace a tu correo una vez que el sistema de correo transaccional esté configurado.
  </div>
  <a href="Catalog.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:700;padding:12px 24px;border:1.5px solid rgba(110,231,183,.3);border-radius:6px;color:#e2e8f0">Seguir explorando el catálogo</a>
</div>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
const RESOURCES = {
  checklist: { name: 'Checklist para consulta nutricional', cover: 'assets/img/covers/checklist-consulta.png', file: 'assets/free/checklist-consulta-nutricional.xlsx' },
  demo: { name: 'Plantilla gratuita de ejemplo', cover: 'assets/img/covers/excel-lab-demo.png', file: 'assets/free/plantilla-excel-lab-demo.xlsx' }
};

class Component extends DCLogic {
  renderVals() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'checklist';
    return { resource: RESOURCES[id] || RESOURCES.checklist };
  }
}

</script>
</body>
</html>
