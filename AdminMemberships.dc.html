<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="./store.js"></script>
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Inter Tight',system-ui,sans-serif;color:#e2e8f0;position:relative}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(110,231,183,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,183,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%)}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 520px at 88% 12%,rgba(16,185,129,.13),transparent 70%),radial-gradient(circle 460px at 6% 78%,rgba(255,122,69,.08),transparent 70%)}
  body > *{position:relative;z-index:1}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}
  .mono{font-family:'JetBrains Mono',monospace}

  /* ---- Responsive móvil (no afecta escritorio) ---- */
  img,svg,canvas,video{max-width:100%;height:auto}
  @media (max-width:900px){
    /* Cualquier tabla ancha scrollea dentro de su caja en vez de estirar la página */
    div:has(> [role="table"]){overflow-x:auto;-webkit-overflow-scrolling:touch}
    /* Paneles admin/cliente: la barra lateral pasa arriba */
    [style*="grid-template-columns:220px 1fr"]{grid-template-columns:1fr !important}
    [style*="grid-template-columns:220px 1fr"] > div:first-child{padding:14px 16px !important}
  }
  @media (max-width:640px){
    /* 40px de margen lateral se comen un cuarto de una pantalla de 320px */
    .section{padding-left:20px !important;padding-right:20px !important;padding-top:44px !important;padding-bottom:44px !important}
    body > div[style*="margin:0 auto"]{padding-left:20px !important;padding-right:20px !important}
    body > div[style*="margin:0 auto"] > div[style*="padding"]{padding-left:0 !important;padding-right:0 !important}
    h1{font-size:clamp(26px,7.4vw,34px) !important;line-height:1.18 !important}
    h2{font-size:clamp(20px,5.4vw,24px) !important}
    /* Objetivos táctiles cómodos */
    button,[role="button"],.btn-primary,.btn-secondary{min-height:44px}
    /* CTA a ancho completo: dos botones lado a lado no caben bien */
    .btn-primary,.btn-secondary{width:100%;box-sizing:border-box}
  }
  @media (max-width:560px){
    /* Toda grilla conocida pasa a una columna */
    .rg-hero,.rg-trust,.rg-featured,.rg-steps,.rg-sheets,.rg-packages,.rg-resources,
    .rg-leadmagnet,.rg-problem,.rg-membership,.rg-cart,.rg-checkout,.rg-checkout-fields,
    .rg-catalog-grid,.rg-pkg-cards,.rg-mockup-stats,.nmx-hero,.nmx-body,.nmx-meta,
    .doc-grid,.doc-kpis,.doc-phases,.doc-split,.hiw-steps,.hiw-sheets,.hiw-split{
      grid-template-columns:1fr !important
    }
    .section{padding-left:16px !important;padding-right:16px !important}
    body > div[style*="margin:0 auto"]{padding-left:16px !important;padding-right:16px !important}
  }
</style>
</helmet>

<div style="display:grid;grid-template-columns:220px 1fr;min-height:100vh">
  <div style="background:#04140f;padding:20px 14px">
    <dc-import name="AdminNav" active="membresias" hint-size="192px,480px"></dc-import>
  </div>

  <div style="padding:28px 36px 60px">
    <h1 style="font-size:24px;font-weight:800;margin:0 0 8px;letter-spacing:-.3px">Membresías</h1>
    <p style="font-size:12.5px;color:#8fa9a0;margin:0 0 22px">Sin Transbank conectado, confirma aquí a mano las solicitudes de membresía ($2.990/mes, 15% de descuento).</p>

    <sc-if value="{{ confirmMsg }}" hint-placeholder-val="{{ false }}">
      <div style="background:rgba(110,231,183,.08);border:1px solid rgba(110,231,183,.25);border-radius:6px;padding:11px 16px;font-size:12.5px;color:#6ee7b7;margin-bottom:16px">{{ confirmMsg }}</div>
    </sc-if>

    <div style="background:rgba(255,255,255,.04);border:1px solid rgba(110,231,183,.16);border-radius:8px;overflow:hidden">
      <div role="table" style="display:flex;flex-direction:column;min-width:820px">
        <div role="row" style="display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.2fr;background:rgba(255,255,255,.03);font-size:11.5px;font-weight:700;color:#c7dad2">
          <div style="padding:12px 16px">Cliente</div>
          <div style="padding:12px 16px">Estado</div>
          <div style="padding:12px 16px">Solicitada</div>
          <div style="padding:12px 16px">Vence</div>
          <div style="padding:12px 16px">Acción</div>
        </div>
        <sc-for list="{{ memberships }}" as="m" hint-placeholder-count="4">
          <div role="row" style="display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.2fr;border-top:1px solid rgba(110,231,183,.12);align-items:center;font-size:12.5px">
            <div style="padding:12px 16px;font-weight:700">{{ m.email }}</div>
            <div style="padding:12px 16px"><span class="mono" style="font-size:10px;padding:3px 8px;border-radius:3px;background:{{ m.statusBg }};color:{{ m.statusColor }}">{{ m.statusLabel }}</span></div>
            <div style="padding:12px 16px;color:#8fa9a0" class="mono">{{ m.requested }}</div>
            <div style="padding:12px 16px;color:#8fa9a0" class="mono">{{ m.expires }}</div>
            <div style="padding:12px 16px">
              <sc-if value="{{ m.canConfirm }}" hint-placeholder-val="{{ false }}">
                <button type="button" disabled="{{ m.confirming }}" onClick="{{ m.onConfirm }}" style="appearance:none;font-family:inherit;font-size:11.5px;font-weight:700;padding:7px 14px;background:#6ee7b7;color:#04140f;border:none;border-radius:5px;cursor:pointer;opacity:{{ m.confirmOpacity }}">{{ m.confirmLabel }}</button>
              </sc-if>
              <sc-if value="{{ !m.canConfirm }}" hint-placeholder-val="{{ true }}">
                <span class="mono" style="font-size:10.5px;color:#7f9a91">—</span>
              </sc-if>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="padding:32px 16px;text-align:center;color:#8fa9a0;font-size:13px">No hay solicitudes ni membresías activas.</div>
        </sc-if>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { memberships: [], loaded: false, confirmingId: null, confirmMsg: '' };

  async componentDidMount() {
    if (!window.NMXStore) { setTimeout(() => this.componentDidMount(), 30); return; }
    const session = await window.NMXStore.getSession();
    if (!session || session.role !== 'admin') { window.location.href = 'Login.dc.html'; return; }
    if (this._nmxAdminMount) this._nmxAdminMount();
    this._load();
  }

  async _load() {
    try {
      const memberships = await window.NMXStore.adminListMemberships();
      this.setState({ memberships, loaded: true });
    } catch (e) {
      this.setState({ loaded: true, confirmMsg: 'No se pudieron cargar las membresías.' });
    }
  }

  async _confirm(userId) {
    this.setState({ confirmingId: userId, confirmMsg: '' });
    try {
      await window.NMXStore.adminConfirmMembership(userId);
      this.setState({ confirmingId: null, confirmMsg: 'Membresía activada por 1 mes.' });
      this._load();
    } catch (e) {
      this.setState({ confirmingId: null, confirmMsg: (e && e.message) || 'No se pudo confirmar.' });
    }
  }

  renderVals() {
    const memberships = this.state.memberships.map((m) => {
      const pending = m.membership_status === 'pending';
      const confirming = this.state.confirmingId === m.id;
      return {
        email: m.email,
        statusLabel: pending ? 'Pendiente' : 'Activa',
        statusBg: pending ? 'rgba(255,148,102,.14)' : 'rgba(110,231,183,.12)',
        statusColor: pending ? '#ff9466' : '#6ee7b7',
        requested: m.membership_requested_at ? new Date(m.membership_requested_at).toLocaleDateString('es-CL') : '—',
        expires: m.membership_expires_at ? new Date(m.membership_expires_at).toLocaleDateString('es-CL') : '—',
        canConfirm: pending,
        confirming,
        confirmOpacity: confirming ? 0.6 : 1,
        confirmLabel: confirming ? 'Confirmando…' : 'Activar',
        onConfirm: () => this._confirm(m.id)
      };
    });
    return { memberships, isEmpty: this.state.loaded && memberships.length === 0, confirmMsg: this.state.confirmMsg };
  }
}

</script>
</body>
</html>
