<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Manrope',system-ui,sans-serif;color:#e2e8f0}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}
</style>
</helmet>

<dc-import name="Header" active="" cart-count="2" hint-size="100%,64px"></dc-import>

<div style="max-width:820px;margin:0 auto;padding:40px 40px 80px">
  <div style="background:rgba(255,255,255,.035);border:1px solid rgba(110,231,183,.14);border-radius:6px;padding:14px 18px;font-size:12.5px;color:#c7dad2;margin-bottom:28px">
    Borrador informativo pendiente de revisión antes de publicación.
  </div>
  <h1 style="font-size:26px;font-weight:800;margin:0 0 32px;letter-spacing:-.3px">Política de actualizaciones y soporte</h1>

  <sc-for list="{{ sections }}" as="s" hint-placeholder-count="8">
    <div style="margin-bottom:26px">
      <h2 style="font-size:15.5px;font-weight:800;margin:0 0 8px">{{ s.title }}</h2>
      <p style="font-size:13.5px;color:#b7cfc6;line-height:1.65;margin:0">{{ s.text }}</p>
    </div>
  </sc-for>
</div>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        {title:'Qué se considera una actualización', text:'Correcciones de fórmulas, mejoras de estructura, o incorporación de nuevas hojas dentro de una misma herramienta.'},
        {title:'Versiones menores y mayores', text:'Las versiones menores incluyen correcciones y ajustes; las versiones mayores pueden incorporar funciones nuevas relevantes.'},
        {title:'Acceso según producto o membresía', text:'El acceso a nuevas versiones depende de si el producto fue comprado individualmente o forma parte de una membresía activa.'},
        {title:'Compatibilidad', text:'Cada versión indica su compatibilidad probada. No se garantiza funcionamiento en plataformas marcadas como no probadas.'},
        {title:'Canales de soporte', text:'El soporte se gestiona a través del formulario disponible en el área del cliente.'},
        {title:'Información técnica necesaria', text:'Para resolver una solicitud se solicitará producto, versión, sistema operativo y versión de Excel utilizada.'},
        {title:'Plazos', text:'Los tiempos de respuesta se informarán una vez definido el canal de soporte real; no se prometen plazos específicos en este prototipo.'},
        {title:'Productos retirados por corrección', text:'Un producto puede retirarse temporalmente si se detecta un error relevante, hasta su corrección y republicación.'}
      ]
    };
  }
}

</script>
</body>
</html>
