<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/img/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#04140f">
<script src="./support.js"></script>
<script src="./store.js"></script>
</head>
<body>
<x-dc>
<nav style="display:flex;flex-direction:column;gap:2px;font-family:'Inter Tight',system-ui,sans-serif">
  <div style="padding:12px 14px;margin-bottom:10px;border:1px solid #e7e5df;border-radius:6px;background:#f6f8f7">
    <div style="font-weight:800;font-size:13.5px;color:#0f1f2b">{{ userName }}</div>
    <div style="font-size:11.5px;color:#7a8a90">{{ userEmail }}</div>
  </div>
  <a href="ClientArea.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cResumen }};background:{{ bResumen }}">Resumen</a>
  <a href="MyProducts.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cProductos }};background:{{ bProductos }}">Mis productos</a>
  <a href="Orders.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cPedidos }};background:{{ bPedidos }}">Pedidos</a>
  <a href="ClientMembership.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cMembresia }};background:{{ bMembresia }}">Membresía</a>
  <a href="Profile.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cPerfil }};background:{{ bPerfil }}">Perfil</a>
  <a href="Contact.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cSoporte }};background:{{ bSoporte }}">Soporte</a>
  <div onClick="{{ onLogout }}" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:#c1402f;cursor:pointer;margin-top:8px;border-top:1px solid #e7e5df;padding-top:14px">Cerrar sesión</div>
</nav>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:360},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;resumen&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;resumen&quot;,&quot;productos&quot;,&quot;pedidos&quot;,&quot;membresia&quot;,&quot;perfil&quot;,&quot;soporte&quot;]}}">
class Component extends DCLogic {
  state = { userName: '', userEmail: '' };

  componentDidMount() {
    this._loadSession();
    window.addEventListener('nmx:session-changed', this._loadSession);
  }
  componentWillUnmount() {
    window.removeEventListener('nmx:session-changed', this._loadSession);
  }
  _loadSession = async () => {
    if (!window.NMXStore) { setTimeout(this._loadSession, 30); return; }
    const session = await window.NMXStore.getSession();
    if (session) this.setState({ userName: session.name || session.email, userEmail: session.email });
  };

  renderVals() {
    const active = this.props.active || '';
    const teal = '#0f5c56';
    const gray = '#374850';
    const activeBg = '#e6f3f1';
    const mk = (key) => ({
      color: active === key ? teal : gray,
      bg: active === key ? activeBg : 'transparent'
    });
    const resumen = mk('resumen');
    const productos = mk('productos');
    const pedidos = mk('pedidos');
    const membresia = mk('membresia');
    const perfil = mk('perfil');
    const soporte = mk('soporte');
    return {
      userName: this.state.userName || '\u2026',
      userEmail: this.state.userEmail || '',
      cResumen: resumen.color, bResumen: resumen.bg,
      cProductos: productos.color, bProductos: productos.bg,
      cPedidos: pedidos.color, bPedidos: pedidos.bg,
      cMembresia: membresia.color, bMembresia: membresia.bg,
      cPerfil: perfil.color, bPerfil: perfil.bg,
      cSoporte: soporte.color, bSoporte: soporte.bg,
      onLogout: () => {
        window.localStorage.removeItem('nmx_session_v1');
        window.location.href = 'Login.dc.html';
      }
    };
  }
}

</script>
</body>
</html>
