<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/img/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#04140f">
<title>Mis pedidos — NUTRIMETRÍA</title>
<meta name="robots" content="noindex, nofollow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Inter Tight',system-ui,sans-serif;color:#e2e8f0;position:relative}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(110,231,183,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,183,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%)}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 520px at 88% 12%,rgba(16,185,129,.13),transparent 70%),radial-gradient(circle 460px at 6% 78%,rgba(255,122,69,.08),transparent 70%)}
  body > *{position:relative;z-index:1}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}
  .mono{font-family:'JetBrains Mono',monospace}

  /* ---- Responsive móvil (no afecta escritorio) ---- */
  img,svg,canvas,video{max-width:100%;height:auto}
  @media (max-width:900px){
    /* Cualquier tabla ancha scrollea dentro de su caja en vez de estirar la página */
    div:has(> [role="table"]){overflow-x:auto;-webkit-overflow-scrolling:touch}
    /* Paneles admin/cliente: la barra lateral pasa arriba y a ancho completo.
       Se busca el VALOR "220px 1fr" porque el serializador puede meter espacios. */
    [style*="220px 1fr"]{grid-template-columns:1fr !important;gap:18px !important}
    [style*="220px 1fr"] > *{max-width:100% !important;width:100% !important}
    [style*="220px 1fr"] nav{display:flex !important;flex-wrap:wrap;gap:8px !important}
  }
  @media (max-width:640px){
    /* 40px de margen lateral se comen un cuarto de una pantalla de 320px */
    .section{padding-left:20px !important;padding-right:20px !important;padding-top:44px !important;padding-bottom:44px !important}
    div[style*="px 40px"]{padding-inline:20px !important;box-sizing:border-box}
    h1{font-size:clamp(26px,7.4vw,34px) !important;line-height:1.18 !important}
    h2{font-size:clamp(20px,5.4vw,24px) !important}
    button,[role="button"],.btn-primary,.btn-secondary{min-height:44px}
    .cta-row{flex-wrap:wrap}
    .btn-primary,.btn-secondary{flex:1 1 100%;box-sizing:border-box}
    /* Nada puede empujar la página a lo ancho */
    body{overflow-x:hidden}
  }
  @media (max-width:560px){
    .rg-hero,.rg-trust,.rg-featured,.rg-steps,.rg-sheets,.rg-packages,.rg-resources,
    .rg-leadmagnet,.rg-problem,.rg-membership,.rg-cart,.rg-checkout,.rg-checkout-fields,
    .rg-catalog-grid,.rg-pkg-cards,.rg-mockup-stats,.nmx-hero,.nmx-body,.nmx-meta,
    .doc-grid,.doc-kpis,.doc-phases,.doc-split,.hiw-steps,.hiw-sheets,.hiw-split{
      grid-template-columns:1fr !important
    }
    /* Grillas con medidas fijas declaradas inline */
    [style*="1.5fr 1fr"],[style*="1.4fr 1fr"],[style*="1.6fr 1fr"],[style*="1.05fr 1fr"],
    [style*="1.4fr 1fr 1fr 1fr 1fr"],[style*="repeat(3,1fr)"],[style*="repeat(4,1fr)"],
    [style*="repeat(5,1fr)"]{grid-template-columns:1fr !important}
    .section{padding-left:16px !important;padding-right:16px !important}
    div[style*="px 40px"]{padding-inline:16px !important}
  }
</style>
</helmet>

<dc-import name="Header" active="" cart-count="2" hint-size="100%,64px"></dc-import>

<div style="max-width:1200px;margin:0 auto;padding:32px 40px 72px;display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:start">
  <dc-import name="ClientNav" active="pedidos" hint-size="220px,360px"></dc-import>

  <div>
    <h1 style="font-size:24px;font-weight:800;margin:0 0 22px;letter-spacing:-.3px">Pedidos</h1>
    <div style="border:1px solid rgba(110,231,183,.16);border-radius:8px;overflow:hidden">
      <div role="table" style="display:flex;flex-direction:column;font-size:13px;min-width:600px">
        <div role="row" style="display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr;background:rgba(255,255,255,.03)">
          <div role="columnheader" style="padding:12px 16px;font-weight:700;color:#c7dad2">N.° pedido</div>
          <div role="columnheader" style="padding:12px 16px;font-weight:700;color:#c7dad2">Fecha</div>
          <div role="columnheader" style="padding:12px 16px;font-weight:700;color:#c7dad2">Estado</div>
          <div role="columnheader" style="padding:12px 16px;font-weight:700;color:#c7dad2">Total</div>
          <div role="columnheader" style="padding:12px 16px;font-weight:700;color:#c7dad2">Comprobante</div>
        </div>
        <sc-for list="{{ orders }}" as="o" hint-placeholder-count="3">
          <div role="row" style="display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr;border-top:1px solid rgba(110,231,183,.12);align-items:center">
            <div role="cell" style="padding:12px 16px" class="mono">{{ o.number }}</div>
            <div role="cell" style="padding:12px 16px;color:#b7cfc6">{{ o.date }}</div>
            <div role="cell" style="padding:12px 16px"><span class="mono" style="font-size:10.5px;padding:3px 8px;border-radius:3px;background:{{ o.statusBg }};color:{{ o.statusColor }}">{{ o.status }}</span></div>
            <div role="cell" style="padding:12px 16px;font-weight:700">{{ o.total }}</div>
            <div role="cell" style="padding:12px 16px"><a href="{{ o.href }}" style="text-decoration:none;font-weight:700">Ver detalle</a></div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
const STATUS_STYLE = {
  paid: { label: 'Pagado', bg: 'rgba(110,231,183,.12)', color: '#6ee7b7' },
  pending: { label: 'Pendiente', bg: 'rgba(255,148,102,.14)', color: '#ff9466' },
  failed: { label: 'Fallido', bg: 'rgba(255,107,94,.14)', color: '#ff6b5e' }
};

class Component extends DCLogic {
  state = { orders: [], loaded: false };

  componentDidMount() {
    this._init();
  }

  async _init() {
    if (!window.NMXStore) { setTimeout(() => this._init(), 30); return; }
    const session = await window.NMXStore.getSession();
    if (!session) {
      window.location.href = 'Login.dc.html';
      return;
    }
    try {
      const orders = await window.NMXStore.getMyOrders();
      this.setState({ orders, loaded: true });
    } catch (e) {
      this.setState({ orders: [], loaded: true });
    }
  }

  renderVals() {
    const orders = (this.state.orders || []).map((o) => {
      const st = STATUS_STYLE[o.status] || { label: o.status, bg: 'rgba(255,255,255,.06)', color: '#b7cfc6' };
      return {
        number: o.order_code || o.orderCode,
        date: o.created_at ? new Date(o.created_at).toLocaleDateString('es-CL') : '',
        status: st.label, statusBg: st.bg, statusColor: st.color,
        total: '$' + Number(o.total_clp).toLocaleString('es-CL') + ' CLP',
        href: 'Confirmation.dc.html?order=' + encodeURIComponent(o.order_code || o.orderCode)
      };
    });
    return { orders };
  }
}

</script>
</body>
</html>
