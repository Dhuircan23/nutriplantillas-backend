<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="./store.js"></script>
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Manrope',system-ui,sans-serif;color:#e2e8f0}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}
  .mono{font-family:'JetBrains Mono',monospace}
</style>
</helmet>

<dc-import name="Header" active="" cart-count="2" hint-size="100%,64px"></dc-import>

<div style="max-width:1200px;margin:0 auto;padding:32px 40px 72px;display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:start">
  <dc-import name="ClientNav" active="membresia" hint-size="220px,360px"></dc-import>

  <div>
    <h1 style="font-size:24px;font-weight:800;margin:0 0 22px;letter-spacing:-.3px">Membresía</h1>

    <div style="border:1px solid {{ cardBorder }};border-radius:8px;padding:22px;margin-bottom:28px;background:{{ cardBg }}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div style="font-weight:800;font-size:16px;color:{{ statusColor }}">{{ statusLabel }}</div>
        <sc-if value="{{ status === 'none' }}" hint-placeholder-val="{{ false }}">
          <button type="button" disabled="{{ submitting }}" onClick="{{ onSubscribe }}" style="appearance:none;font-family:inherit;padding:9px 16px;background:#6ee7b7;color:#04140f;border:none;border-radius:5px;font-weight:700;font-size:12.5px;cursor:pointer;opacity:{{ btnOpacity }}">{{ btnLabel }}</button>
        </sc-if>
      </div>
      <p style="font-size:13px;color:#c7dad2;margin:0">{{ statusDesc }}</p>
      <sc-if value="{{ errorMsg }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:12px;color:#ff6b5e;font-weight:600;margin-top:10px">{{ errorMsg }}</div>
      </sc-if>
    </div>

    <h2 style="font-size:16px;font-weight:800;margin:0 0 12px">Historial de compras</h2>
    <div style="border:1px solid rgba(110,231,183,.16);border-radius:8px;overflow:hidden;margin-bottom:8px">
      <div role="table" style="display:flex;flex-direction:column">
        <div role="row" style="display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;background:rgba(255,255,255,.03);font-size:11.5px;font-weight:700;color:#c7dad2">
          <div style="padding:10px 14px">Pedido</div>
          <div style="padding:10px 14px">Fecha</div>
          <div style="padding:10px 14px">Monto</div>
          <div style="padding:10px 14px">Estado</div>
        </div>
        <sc-for list="{{ orders }}" as="o" hint-placeholder-count="3">
          <div role="row" style="display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;border-top:1px solid rgba(110,231,183,.12);font-size:12.5px;align-items:center">
            <div style="padding:10px 14px" class="mono">{{ o.number }}</div>
            <div style="padding:10px 14px;color:#8fa9a0" class="mono">{{ o.date }}</div>
            <div style="padding:10px 14px;font-weight:700">{{ o.total }}</div>
            <div style="padding:10px 14px"><span class="mono" style="font-size:10px;padding:3px 8px;border-radius:3px;background:{{ o.statusBg }};color:{{ o.statusColor }}">{{ o.status }}</span></div>
          </div>
        </sc-for>
      </div>
    </div>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center;color:#8fa9a0;font-size:13px;padding:20px 0">Todavía no tienes compras. <a href="Catalog.dc.html">Explora las herramientas</a>.</div>
    </sc-if>
  </div>
</div>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
const STATUS_LABEL = {
  pending: { label: 'Pendiente', bg: 'rgba(255,148,102,.14)', color: '#ff9466' },
  payment_processing: { label: 'Esperando pago', bg: 'rgba(255,148,102,.14)', color: '#ff9466' },
  authorized: { label: 'Autorizado', bg: 'rgba(255,148,102,.14)', color: '#ff9466' },
  paid: { label: 'Pagado', bg: 'rgba(110,231,183,.12)', color: '#6ee7b7' },
  failed: { label: 'Fallido', bg: '#fde8e6', color: '#ff6b5e' },
  cancelled: { label: 'Cancelado', bg: 'rgba(255,255,255,.06)', color: '#b7cfc6' },
  refunded: { label: 'Reembolsado', bg: 'rgba(255,255,255,.06)', color: '#b7cfc6' }
};

class Component extends DCLogic {
  state = { orders: [], loaded: false, membership: 'none', expiresAt: null, submitting: false, errorMsg: '' };

  async componentDidMount() {
    if (!window.NMXStore) { setTimeout(() => this.componentDidMount(), 30); return; }
    const session = await window.NMXStore.getSession();
    if (!session) { window.location.href = 'Login.dc.html'; return; }
    this.setState({ membership: session.membershipStatus || 'none', expiresAt: session.membershipExpiresAt });
    try {
      const orders = await window.NMXStore.getMyOrders();
      this.setState({ orders, loaded: true });
    } catch (e) {
      this.setState({ orders: [], loaded: true });
    }
  }

  async _subscribe() {
    this.setState({ submitting: true, errorMsg: '' });
    try {
      await window.NMXStore.subscribeMembership();
      this.setState({ submitting: false, membership: 'pending' });
    } catch (err) {
      this.setState({ submitting: false, errorMsg: (err && err.message) || 'No se pudo enviar la solicitud.' });
    }
  }

  renderVals() {
    const orders = (this.state.orders || []).map((o) => {
      const st = STATUS_LABEL[o.status] || { label: o.status, bg: 'rgba(255,255,255,.06)', color: '#b7cfc6' };
      return {
        number: o.order_code || o.orderCode,
        date: new Date(o.created_at || o.createdAt).toLocaleDateString('es-CL'),
        total: '$' + Number(o.total_clp || 0).toLocaleString('es-CL'),
        status: st.label, statusBg: st.bg, statusColor: st.color
      };
    });

    const status = this.state.membership;
    const view = {
      active: { label: 'Membresía activa · 15% de descuento', color: '#6ee7b7', border: 'rgba(110,231,183,.25)', bg: 'rgba(110,231,183,.06)', desc: 'Vigente hasta ' + (this.state.expiresAt ? new Date(this.state.expiresAt).toLocaleDateString('es-CL') : '') + '. El descuento ya se aplica en tu carrito.' },
      pending: { label: 'Solicitud pendiente', color: '#ff9466', border: 'rgba(255,148,102,.28)', bg: 'rgba(255,148,102,.07)', desc: 'Un administrador confirmará tu pago y activará el descuento en las próximas horas.' },
      none: { label: 'Sin membresía', color: '#e2e8f0', border: 'rgba(110,231,183,.16)', bg: 'transparent', desc: '$2.990 CLP al mes por un 15% de descuento en cualquier compra.' }
    }[status] || { label: 'Sin membresía', color: '#e2e8f0', border: 'rgba(110,231,183,.16)', bg: 'transparent', desc: '' };

    return {
      orders, isEmpty: this.state.loaded && orders.length === 0,
      status, statusLabel: view.label, statusColor: view.color, cardBorder: view.border, cardBg: view.bg, statusDesc: view.desc,
      submitting: this.state.submitting, btnOpacity: this.state.submitting ? 0.65 : 1,
      btnLabel: this.state.submitting ? 'Enviando…' : 'Activar $2.990/mes',
      errorMsg: this.state.errorMsg,
      onSubscribe: () => this._subscribe()
    };
  }
}

</script>
</body>
</html>
