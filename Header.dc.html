<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="./store.js"></script>
</helmet>
<header style="position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 40px;background:rgba(4,20,15,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(110,231,183,.14);font-family:'Manrope',system-ui,sans-serif">
  <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
    <svg width="30" height="30" viewBox="0 0 30 30"><rect x="2" y="2" width="26" height="26" rx="5" fill="#6ee7b7"></rect><rect x="7.5" y="7.5" width="15" height="3" fill="#04140f"></rect><rect x="7.5" y="13.5" width="6.5" height="3" fill="#0a251c"></rect><rect x="16" y="13.5" width="6.5" height="3" fill="#04140f"></rect><rect x="7.5" y="19.5" width="15" height="3" fill="#0a251c"></rect></svg>
    <div style="display:flex;flex-direction:column;line-height:1.1">
      <span style="font-weight:800;font-size:16.5px;color:#eef7f3;letter-spacing:-.2px">NutriPlantillas</span>
      <span style="font-size:10px;font-weight:700;color:#6ee7b7;letter-spacing:.5px;text-transform:uppercase">by Nutrimetría</span>
    </div>
  </a>

  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <nav style="display:flex;align-items:center;gap:22px;font-size:13px;font-weight:600;color:#9fb8ae;white-space:nowrap">
      <a href="Catalog.dc.html" style="text-decoration:none;color:{{ navColorTienda }};border-bottom:2px solid {{ navBorderTienda }};padding-bottom:18px;margin-bottom:-18px">Tienda</a>
      <a href="Packages.dc.html" style="text-decoration:none;color:{{ navColorPaquetes }};border-bottom:2px solid {{ navBorderPaquetes }};padding-bottom:18px;margin-bottom:-18px">Paquetes</a>
      <a href="Resources.dc.html" style="text-decoration:none;color:{{ navColorRecursos }};border-bottom:2px solid {{ navBorderRecursos }};padding-bottom:18px;margin-bottom:-18px">Recursos</a>
      <a href="Docs.dc.html" style="text-decoration:none;color:{{ navColorDocs }};border-bottom:2px solid {{ navBorderDocs }};padding-bottom:18px;margin-bottom:-18px">Documentación</a>
      <a href="HowItWorks.dc.html" style="text-decoration:none;color:{{ navColorComo }};border-bottom:2px solid {{ navBorderComo }};padding-bottom:18px;margin-bottom:-18px">Cómo funciona</a>
      <a href="FAQ.dc.html" style="text-decoration:none;color:{{ navColorFaq }};border-bottom:2px solid {{ navBorderFaq }};padding-bottom:18px;margin-bottom:-18px">Preguntas frecuentes</a>
    </nav>
  </sc-if>

  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:18px">
      <a href="Catalog.dc.html" aria-label="Buscar" style="color:#9fb8ae;display:flex" onClick="{{ onSearchClick }}">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      </a>
      <sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
        <form onSubmit="{{ onSearchSubmit }}" style="position:absolute;top:64px;right:40px;background:rgba(4,20,15,.96);border:1px solid rgba(110,231,183,.25);border-radius:8px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.4)">
          <input autoFocus="{{ true }}" value="{{ searchQuery }}" onChange="{{ onSearchQueryChange }}" placeholder="Buscar herramientas…" style="width:220px;padding:9px 12px;border:1px solid rgba(110,231,183,.25);border-radius:5px;font-size:13px;font-family:'Manrope',sans-serif;background:rgba(255,255,255,.05);color:#e2e8f0"/>
        </form>
      </sc-if>
      <a href="Cart.dc.html" aria-label="Carrito" style="position:relative;color:#9fb8ae;display:flex">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path></svg>
        <sc-if value="{{ hasCartItems }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;top:-8px;right:-9px;background:#ff7a45;color:#04140f;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px">{{ cartCount }}</span>
        </sc-if>
      </a>
      <a href="{{ accountHref }}" style="text-decoration:none;padding:9px 14px;border:1.5px solid rgba(110,231,183,.3);color:#e2e8f0;border-radius:5px;font-size:13px;font-weight:700;display:{{ accountDisplay }}">Mi cuenta</a>
      <button type="button" onClick="{{ onLogout }}" style="appearance:none;font-family:inherit;text-decoration:none;padding:9px 18px;background:#6ee7b7;color:#04140f;border:none;border-radius:5px;font-size:13px;font-weight:700;cursor:pointer;display:{{ logoutDisplay }}">Cerrar sesión</button>
      <a href="Login.dc.html" style="text-decoration:none;padding:9px 18px;background:#6ee7b7;color:#04140f;border-radius:5px;font-size:13px;font-weight:700;display:{{ loginDisplay }}">Iniciar sesión</a>
    </div>
  </sc-if>

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:6px">
      <a href="Cart.dc.html" aria-label="Carrito" style="position:relative;color:#9fb8ae;display:flex;align-items:center;justify-content:center;width:44px;height:44px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path></svg>
        <sc-if value="{{ hasCartItems }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;top:2px;right:2px;background:#ff7a45;color:#04140f;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px">{{ cartCount }}</span>
        </sc-if>
      </a>
      <button aria-label="Abrir menú" onClick="{{ toggleMenu }}" style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid rgba(110,231,183,.25);border-radius:6px;background:rgba(255,255,255,.04);cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
  </sc-if>
</header>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <nav style="position:sticky;top:64px;z-index:39;background:rgba(4,20,15,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(110,231,183,.14);padding:8px 24px 18px;display:flex;flex-direction:column;font-family:'Manrope',system-ui,sans-serif">
    <a href="Catalog.dc.html" style="text-decoration:none;color:#eef7f3;font-weight:600;font-size:15px;padding:12px 0;border-bottom:1px solid rgba(110,231,183,.12)">Tienda</a>
    <a href="Packages.dc.html" style="text-decoration:none;color:#eef7f3;font-weight:600;font-size:15px;padding:12px 0;border-bottom:1px solid rgba(110,231,183,.12)">Paquetes</a>
    <a href="Resources.dc.html" style="text-decoration:none;color:#eef7f3;font-weight:600;font-size:15px;padding:12px 0;border-bottom:1px solid rgba(110,231,183,.12)">Recursos</a>
    <a href="Docs.dc.html" style="text-decoration:none;color:#eef7f3;font-weight:600;font-size:15px;padding:12px 0;border-bottom:1px solid rgba(110,231,183,.12)">Documentación</a>
    <a href="HowItWorks.dc.html" style="text-decoration:none;color:#eef7f3;font-weight:600;font-size:15px;padding:12px 0;border-bottom:1px solid rgba(110,231,183,.12)">Cómo funciona</a>
    <a href="FAQ.dc.html" style="text-decoration:none;color:#eef7f3;font-weight:600;font-size:15px;padding:12px 0;border-bottom:1px solid rgba(110,231,183,.12)">Preguntas frecuentes</a>
    <a href="{{ accountHref }}" style="text-decoration:none;text-align:center;margin-top:16px;padding:12px;border:1.5px solid rgba(110,231,183,.3);color:#eef7f3;border-radius:6px;font-size:14px;font-weight:700;display:{{ accountDisplay }}">Mi cuenta</a>
    <button type="button" onClick="{{ onLogout }}" style="appearance:none;font-family:inherit;text-decoration:none;text-align:center;margin-top:10px;padding:12px;background:#6ee7b7;color:#04140f;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;display:{{ logoutDisplay }};width:100%">Cerrar sesión</button>
    <a href="Login.dc.html" style="text-decoration:none;text-align:center;margin-top:16px;padding:12px;background:#6ee7b7;color:#04140f;border-radius:6px;font-size:14px;font-weight:700;display:{{ loginDisplay }}">Iniciar sesión</a>
  </nav>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;tienda&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;tienda&quot;,&quot;paquetes&quot;,&quot;membresia&quot;,&quot;recursos&quot;,&quot;docs&quot;,&quot;como&quot;,&quot;faq&quot;]},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? window.innerWidth : 1440, menuOpen: false, session: null, sessionLoaded: false, cartCount: 0, searchOpen: false, searchQuery: '' };

  componentDidMount() {
    this._onResize = () => {
      if (this._resizeDebounce) clearTimeout(this._resizeDebounce);
      this._resizeDebounce = setTimeout(() => this.setState({ width: window.innerWidth }), 120);
    };
    window.addEventListener('resize', this._onResize);
    this._refresh = () => this._loadSessionAndCart();
    window.addEventListener('nmx:cart-changed', this._refresh);
    window.addEventListener('nmx:session-changed', this._refresh);
    this._loadSessionAndCart();
  }

  componentWillUnmount() {
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    if (this._refresh) {
      window.removeEventListener('nmx:cart-changed', this._refresh);
      window.removeEventListener('nmx:session-changed', this._refresh);
    }
    if (this._resizeDebounce) clearTimeout(this._resizeDebounce);
  }

  async _loadSessionAndCart() {
    if (!window.NMXStore) { setTimeout(() => this._loadSessionAndCart(), 30); return; }
    const session = await window.NMXStore.getSession();
    const cartCount = session ? await window.NMXStore.getCartCount() : 0;
    this.setState({ session, sessionLoaded: true, cartCount });
  }

  renderVals() {
    const active = this.props.active || '';
    const isDesktop = this.state.width >= 1100;
    const isMobile = !isDesktop;
    const teal = '#6ee7b7';
    const gray = '#9fb8ae';
    const transparent = 'transparent';
    const mk = (key) => ({
      color: active === key ? teal : gray,
      border: active === key ? teal : transparent
    });
    const tienda = mk('tienda');
    const paquetes = mk('paquetes');
    const recursos = mk('recursos');
    const docs = mk('docs');
    const como = mk('como');
    const faq = mk('faq');
    const cartCount = this.state.sessionLoaded ? this.state.cartCount : (this.props.cartCount ?? 0);
    const isLoggedIn = !!(this.state.session && this.state.session.role);
    return {
      accountHref: this.state.session && this.state.session.role === 'admin' ? 'AdminDashboard.dc.html' : 'ClientArea.dc.html',
      accountDisplay: isLoggedIn ? 'flex' : 'none',
      logoutDisplay: isLoggedIn ? 'flex' : 'none',
      loginDisplay: isLoggedIn ? 'none' : 'flex',
      onLogout: async () => {
        if (window.NMXStore) await window.NMXStore.logout();
        window.location.href = 'Home.dc.html';
      },
      navColorTienda: tienda.color, navBorderTienda: tienda.border,
      navColorPaquetes: paquetes.color, navBorderPaquetes: paquetes.border,
      navColorRecursos: recursos.color, navBorderRecursos: recursos.border,
      navColorDocs: docs.color, navBorderDocs: docs.border,
      navColorComo: como.color, navBorderComo: como.border,
      navColorFaq: faq.color, navBorderFaq: faq.border,
      searchOpen: this.state.searchOpen,
      searchQuery: this.state.searchQuery,
      onSearchClick: (e) => { e.preventDefault(); this.setState((s) => ({ searchOpen: !s.searchOpen })); },
      onSearchQueryChange: (e) => this.setState({ searchQuery: e.target.value }),
      onSearchSubmit: (e) => {
        e.preventDefault();
        const q = (this.state.searchQuery || '').trim();
        window.location.href = q ? ('Catalog.dc.html?q=' + encodeURIComponent(q)) : 'Catalog.dc.html';
      },
      cartCount,
      hasCartItems: cartCount > 0,
      isDesktop,
      isMobile,
      menuOpen: isDesktop ? false : this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen }))
    };
  }
}

</script>
</body>
</html>
