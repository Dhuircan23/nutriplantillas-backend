<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Inter Tight',system-ui,sans-serif;color:#e2e8f0;position:relative}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(110,231,183,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,183,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%)}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 520px at 88% 12%,rgba(16,185,129,.13),transparent 70%),radial-gradient(circle 460px at 6% 78%,rgba(255,122,69,.08),transparent 70%)}
  body > *{position:relative;z-index:1}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}

  /* ---- Responsive móvil (no afecta escritorio) ---- */
  img,svg,canvas,video{max-width:100%;height:auto}
  @media (max-width:900px){
    /* Cualquier tabla ancha scrollea dentro de su caja en vez de estirar la página */
    div:has(> [role="table"]){overflow-x:auto;-webkit-overflow-scrolling:touch}
    /* Paneles admin/cliente: la barra lateral pasa arriba y a ancho completo.
       Se busca el VALOR "220px 1fr" porque el serializador puede meter espacios. */
    [style*="220px 1fr"]{grid-template-columns:1fr !important;gap:18px !important}
    [style*="220px 1fr"] > *{max-width:100% !important;width:100% !important}
    [style*="220px 1fr"] nav{display:flex !important;flex-wrap:wrap;gap:8px !important}
  }
  @media (max-width:640px){
    /* 40px de margen lateral se comen un cuarto de una pantalla de 320px */
    .section{padding-left:20px !important;padding-right:20px !important;padding-top:44px !important;padding-bottom:44px !important}
    div[style*="px 40px"]{padding-inline:20px !important;box-sizing:border-box}
    h1{font-size:clamp(26px,7.4vw,34px) !important;line-height:1.18 !important}
    h2{font-size:clamp(20px,5.4vw,24px) !important}
    button,[role="button"],.btn-primary,.btn-secondary{min-height:44px}
    .btn-primary,.btn-secondary{width:100%;box-sizing:border-box}
    /* Nada puede empujar la página a lo ancho */
    body{overflow-x:hidden}
  }
  @media (max-width:560px){
    .rg-hero,.rg-trust,.rg-featured,.rg-steps,.rg-sheets,.rg-packages,.rg-resources,
    .rg-leadmagnet,.rg-problem,.rg-membership,.rg-cart,.rg-checkout,.rg-checkout-fields,
    .rg-catalog-grid,.rg-pkg-cards,.rg-mockup-stats,.nmx-hero,.nmx-body,.nmx-meta,
    .doc-grid,.doc-kpis,.doc-phases,.doc-split,.hiw-steps,.hiw-sheets,.hiw-split{
      grid-template-columns:1fr !important
    }
    /* Grillas con medidas fijas declaradas inline */
    [style*="1.5fr 1fr"],[style*="1.4fr 1fr"],[style*="1.6fr 1fr"],[style*="1.05fr 1fr"],
    [style*="1.4fr 1fr 1fr 1fr 1fr"],[style*="repeat(3,1fr)"],[style*="repeat(4,1fr)"],
    [style*="repeat(5,1fr)"]{grid-template-columns:1fr !important}
    .section{padding-left:16px !important;padding-right:16px !important}
    div[style*="px 40px"]{padding-inline:16px !important}
  }
</style>
</helmet>

<dc-import name="Header" active="" cart-count="2" hint-size="100%,64px"></dc-import>

<div style="max-width:820px;margin:0 auto;padding:40px 40px 80px">
  <div style="background:rgba(255,255,255,.035);border:1px solid rgba(110,231,183,.14);border-radius:6px;padding:14px 18px;font-size:12.5px;color:#c7dad2;margin-bottom:28px">
    Borrador informativo pendiente de revisión legal antes de publicación.
  </div>
  <h1 style="font-size:26px;font-weight:800;margin:0 0 32px;letter-spacing:-.3px">Términos y condiciones</h1>

  <sc-for list="{{ sections }}" as="s" hint-placeholder-count="10">
    <div style="margin-bottom:26px">
      <h2 style="font-size:15.5px;font-weight:800;margin:0 0 8px">{{ s.title }}</h2>
      <p style="font-size:13.5px;color:#b7cfc6;line-height:1.65;margin:0">{{ s.text }}</p>
    </div>
  </sc-for>
</div>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        {title:'Uso de la tienda', text:'NutriPlantillas comercializa herramientas digitales originales. El uso de la tienda implica la aceptación de estos términos, sujetos a revisión legal antes de su publicación definitiva.'},
        {title:'Cuenta del usuario', text:'La creación de una cuenta permite acceder a compras, descargas y soporte. El usuario es responsable de mantener sus credenciales en un lugar seguro.'},
        {title:'Compra de productos digitales', text:'La compra otorga una licencia de uso según lo descrito en la página de Licencia. No se transfiere la propiedad intelectual del archivo.'},
        {title:'Precios', text:'Los precios se muestran en pesos chilenos (CLP) e incluyen los impuestos que correspondan según la normativa vigente.'},
        {title:'Entrega digital', text:'La entrega se realiza mediante descarga directa desde el área del cliente, una vez confirmado el pago.'},
        {title:'Limitaciones', text:'Las herramientas ofrecen apoyo para cálculos, organización y registro. No reemplazan el criterio profesional ni constituyen asesoría médica.'},
        {title:'Responsabilidad del usuario', text:'El usuario es responsable de verificar la aplicabilidad de cada herramienta a su contexto profesional específico.'},
        {title:'Propiedad intelectual', text:'Todo el contenido de la tienda y de los archivos es propiedad de Nutrimetría, salvo licencia expresa de uso.'},
        {title:'Suspensión', text:'Nutrimetría podrá suspender el acceso a la cuenta en caso de uso indebido de los archivos o incumplimiento de la licencia.'},
        {title:'Contacto', text:'Consultas sobre estos términos pueden dirigirse a través de la página de Contacto.'}
      ]
    };
  }
}

</script>
</body>
</html>
