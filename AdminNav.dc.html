<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="display:flex;flex-direction:column;gap:2px;font-family:'Inter Tight',system-ui,sans-serif;height:100%">
  <a href="Home.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;padding:6px 10px 18px">
    <svg width="24" height="24" viewBox="0 0 30 30"><rect x="2" y="2" width="26" height="26" rx="5" fill="#7fd8cd"></rect><rect x="7.5" y="7.5" width="15" height="3" fill="#0f1f2b"></rect><rect x="7.5" y="13.5" width="6.5" height="3" fill="#0f5c56"></rect><rect x="16" y="13.5" width="6.5" height="3" fill="#0f1f2b"></rect><rect x="7.5" y="19.5" width="15" height="3" fill="#0f5c56"></rect></svg>
    <div style="line-height:1.1">
      <div style="font-weight:800;font-size:13.5px;color:#fff">NutriPlantillas</div>
      <div style="font-size:9.5px;font-weight:700;color:#7fd8cd;letter-spacing:.4px;text-transform:uppercase">Panel admin</div>
    </div>
  </a>

  <a href="AdminDashboard.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cDashboard }};background:{{ bDashboard }}">Dashboard</a>
  <a href="AdminProducts.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cProductos }};background:{{ bProductos }}">Productos</a>
  <a href="AdminVersions.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cVersiones }};background:{{ bVersiones }}">Versiones</a>
  <a href="AdminOrders.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cPedidos }};background:{{ bPedidos }}">Pedidos</a>
  <a href="AdminCustomers.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cClientes }};background:{{ bClientes }}">Clientes</a>
  <a href="AdminMemberships.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cMembresias }};background:{{ bMembresias }}">Membresías</a>
  <a href="AdminCoupons.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cCupones }};background:{{ bCupones }}">Cupones</a>
  <a href="AdminSupport.dc.html" style="text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:5px;color:{{ cSoporte }};background:{{ bSoporte }}">Soporte</a>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)">
    <a href="Home.dc.html" style="text-decoration:none;font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:5px;color:#7fd8cd;border:1px solid rgba(127,216,205,.4)">Ver tienda</a>
    <div onClick="{{ onLogout }}" style="text-decoration:none;font-size:12px;font-weight:600;padding:9px 12px;color:#93a5ad;cursor:pointer">Cerrar sesión</div>
  </div>
</nav>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:520},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;productos&quot;,&quot;versiones&quot;,&quot;pedidos&quot;,&quot;clientes&quot;,&quot;cupones&quot;,&quot;soporte&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    const teal = '#7fd8cd';
    const gray = '#c7d2d5';
    const activeBg = 'rgba(127,216,205,.14)';
    const mk = (key) => ({ color: active === key ? teal : gray, bg: active === key ? activeBg : 'transparent' });
    const dashboard = mk('dashboard'), productos = mk('productos'), versiones = mk('versiones'),
      pedidos = mk('pedidos'), clientes = mk('clientes'), membresias = mk('membresias'), cupones = mk('cupones'), soporte = mk('soporte');
    return {
      cDashboard: dashboard.color, bDashboard: dashboard.bg,
      cProductos: productos.color, bProductos: productos.bg,
      cVersiones: versiones.color, bVersiones: versiones.bg,
      cPedidos: pedidos.color, bPedidos: pedidos.bg,
      cClientes: clientes.color, bClientes: clientes.bg,
      cMembresias: membresias.color, bMembresias: membresias.bg,
      cCupones: cupones.color, bCupones: cupones.bg,
      cSoporte: soporte.color, bSoporte: soporte.bg,
      onLogout: () => {
        window.localStorage.removeItem('nmx_session_v1');
        window.location.href = 'Login.dc.html';
      }
    };
  }
}

</script>
</body>
</html>
