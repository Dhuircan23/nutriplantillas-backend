<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/img/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#04140f">
<title>Publicar versión — NUTRIMETRÍA</title>
<meta name="robots" content="noindex, nofollow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="./store.js"></script>
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Inter Tight',system-ui,sans-serif;color:#e2e8f0;position:relative}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(110,231,183,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,183,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%)}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 520px at 88% 12%,rgba(16,185,129,.13),transparent 70%),radial-gradient(circle 460px at 6% 78%,rgba(255,122,69,.08),transparent 70%)}
  body > *{position:relative;z-index:1}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}
  .mono{font-family:'JetBrains Mono',monospace}
  .card{background:rgba(255,255,255,.035);border:1px solid rgba(110,231,183,.16);border-radius:8px;padding:20px}

  /* ---- Responsive móvil (no afecta escritorio) ---- */
  img,svg,canvas,video{max-width:100%;height:auto}
  @media (max-width:900px){
    /* Cualquier tabla ancha scrollea dentro de su caja en vez de estirar la página */
    div:has(> [role="table"]){overflow-x:auto;-webkit-overflow-scrolling:touch}
    /* Paneles admin/cliente: la barra lateral pasa arriba y a ancho completo.
       Se busca el VALOR "220px 1fr" porque el serializador puede meter espacios. */
    [style*="220px 1fr"]{grid-template-columns:1fr !important;gap:18px !important}
    [style*="220px 1fr"] > *{max-width:100% !important;width:100% !important}
    [style*="220px 1fr"] nav{display:flex !important;flex-wrap:wrap;gap:8px !important}
  }
  @media (max-width:640px){
    /* 40px de margen lateral se comen un cuarto de una pantalla de 320px */
    .section{padding-left:20px !important;padding-right:20px !important;padding-top:44px !important;padding-bottom:44px !important}
    div[style*="px 40px"]{padding-inline:20px !important;box-sizing:border-box}
    h1{font-size:clamp(26px,7.4vw,34px) !important;line-height:1.18 !important}
    h2{font-size:clamp(20px,5.4vw,24px) !important}
    button,[role="button"],.btn-primary,.btn-secondary{min-height:44px}
    .cta-row{flex-wrap:wrap}
    .btn-primary,.btn-secondary{flex:1 1 100%;box-sizing:border-box}
    /* Nada puede empujar la página a lo ancho */
    body{overflow-x:hidden}
  }
  @media (max-width:560px){
    .rg-hero,.rg-trust,.rg-featured,.rg-steps,.rg-sheets,.rg-packages,.rg-resources,
    .rg-leadmagnet,.rg-problem,.rg-membership,.rg-cart,.rg-checkout,.rg-checkout-fields,
    .rg-catalog-grid,.rg-pkg-cards,.rg-mockup-stats,.nmx-hero,.nmx-body,.nmx-meta,
    .doc-grid,.doc-kpis,.doc-phases,.doc-split,.hiw-steps,.hiw-sheets,.hiw-split{
      grid-template-columns:1fr !important
    }
    /* Grillas con medidas fijas declaradas inline */
    [style*="1.5fr 1fr"],[style*="1.4fr 1fr"],[style*="1.6fr 1fr"],[style*="1.05fr 1fr"],
    [style*="1.4fr 1fr 1fr 1fr 1fr"],[style*="repeat(3,1fr)"],[style*="repeat(4,1fr)"],
    [style*="repeat(5,1fr)"]{grid-template-columns:1fr !important}
    .section{padding-left:16px !important;padding-right:16px !important}
    div[style*="px 40px"]{padding-inline:16px !important}
  }
</style>
</helmet>

<div style="display:grid;grid-template-columns:220px 1fr;min-height:100vh">
  <div style="background:#04140f;padding:20px 14px">
    <dc-import name="AdminNav" active="versiones" hint-size="192px,480px"></dc-import>
  </div>

  <div style="padding:28px 36px 60px;max-width:640px">
    <div class="mono" style="font-size:12px;color:#8fa9a0;margin-bottom:16px"><a href="AdminVersionDetail.dc.html" style="color:#8fa9a0;text-decoration:none">Registro Antropométrico v1.1</a> / Publicar</div>
    <h1 style="font-size:22px;font-weight:800;margin:0 0 22px;letter-spacing:-.3px">Publicar versión</h1>

    <div class="card" style="margin-bottom:20px">
      <div style="font-weight:800;font-size:14px;margin-bottom:14px">Comprobación final</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ checklist }}" as="c" hint-placeholder-count="8">
          <div style="display:flex;gap:8px;align-items:center;font-size:12.5px"><span style="color:#34d399;font-weight:800">✓</span>{{ c }}</div>
        </sc-for>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <div style="font-weight:800;font-size:14px;margin-bottom:10px">Notificar a compradores</div>
      <label style="display:flex;gap:8px;font-size:12.5px;align-items:center"><input type="checkbox" checked/> Enviar aviso de actualización a los 142 compradores actuales (demostrativo — sin envío real)</label>
    </div>

    <div style="background:rgba(255,255,255,.035);border:1px solid rgba(110,231,183,.14);border-radius:6px;padding:14px 16px;font-size:12.5px;color:#c7dad2;margin-bottom:22px">
      Esta acción es una simulación de publicación. Ningún archivo se sube ni se distribuye realmente desde este prototipo.
    </div>

    <div style="display:flex;gap:12px">
      <a href="AdminVersions.dc.html" style="text-decoration:none;padding:12px 24px;background:#6ee7b7;color:#04140f;border-radius:6px;font-weight:700;font-size:13.5px">Confirmar publicación (demostrativo)</a>
      <a href="AdminVersionDetail.dc.html" style="text-decoration:none;padding:12px 24px;border:1.5px solid rgba(110,231,183,.3);color:#e2e8f0;border-radius:6px;font-weight:700;font-size:13.5px">Cancelar</a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  async componentDidMount() {
    if (!window.NMXStore) { setTimeout(() => this.componentDidMount(), 30); return; }
    const session = await window.NMXStore.getSession();
    if (!session || session.role !== 'admin') {
      window.location.href = 'Login.dc.html';
      return;
    }
    if (this._nmxAdminMount) this._nmxAdminMount();
  }
  renderVals() {
    return {
      checklist: ['Archivo cargado', 'Versión registrada', 'Changelog completo', 'Compatibilidad revisada', 'Pruebas documentadas', 'Limitaciones declaradas', 'Fuentes registradas', 'Precio y acceso comprobados']
    };
  }
}

</script>
</body>
</html>
