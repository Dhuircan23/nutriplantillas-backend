<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/img/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#04140f">
<title>Recursos gratuitos — NUTRIMETRÍA</title>
<meta name="description" content="Plantilla de ejemplo y material de apoyo descargables sin costo ni registro, para conocer el estándar Excel Lab antes de comprar.">
<link rel="canonical" href="https://www.nutrimetria.cc/Resources.dc.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NUTRIMETRÍA">
<meta property="og:locale" content="es_CL">
<meta property="og:title" content="Recursos gratuitos — NUTRIMETRÍA">
<meta property="og:description" content="Plantilla de ejemplo y material de apoyo descargables sin costo ni registro, para conocer el estándar Excel Lab antes de comprar.">
<meta property="og:image" content="https://www.nutrimetria.cc/assets/img/og-cover.png">
<meta property="og:url" content="https://www.nutrimetria.cc/Resources.dc.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Recursos gratuitos — NUTRIMETRÍA">
<meta name="twitter:description" content="Plantilla de ejemplo y material de apoyo descargables sin costo ni registro, para conocer el estándar Excel Lab antes de comprar.">
<meta name="twitter:image" content="https://www.nutrimetria.cc/assets/img/og-cover.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Inter Tight',system-ui,sans-serif;color:#e2e8f0;position:relative}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(110,231,183,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,183,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%)}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 520px at 88% 12%,rgba(16,185,129,.13),transparent 70%),radial-gradient(circle 460px at 6% 78%,rgba(255,122,69,.08),transparent 70%)}
  body > *{position:relative;z-index:1}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}
  .mono{font-family:'JetBrains Mono',monospace}

  /* ---- Responsive móvil (no afecta escritorio) ---- */
  img,svg,canvas,video{max-width:100%;height:auto}
  @media (max-width:900px){
    /* Cualquier tabla ancha scrollea dentro de su caja en vez de estirar la página */
    div:has(> [role="table"]){overflow-x:auto;-webkit-overflow-scrolling:touch}
    /* Paneles admin/cliente: la barra lateral pasa arriba y a ancho completo.
       Se busca el VALOR "220px 1fr" porque el serializador puede meter espacios. */
    [style*="220px 1fr"]{grid-template-columns:1fr !important;gap:18px !important}
    [style*="220px 1fr"] > *{max-width:100% !important;width:100% !important}
    [style*="220px 1fr"] nav{display:flex !important;flex-wrap:wrap;gap:8px !important}
  }
  @media (max-width:640px){
    /* 40px de margen lateral se comen un cuarto de una pantalla de 320px */
    .section{padding-left:20px !important;padding-right:20px !important;padding-top:44px !important;padding-bottom:44px !important}
    div[style*="px 40px"]{padding-inline:20px !important;box-sizing:border-box}
    h1{font-size:clamp(26px,7.4vw,34px) !important;line-height:1.18 !important}
    h2{font-size:clamp(20px,5.4vw,24px) !important}
    button,[role="button"],.btn-primary,.btn-secondary{min-height:44px}
    .cta-row{flex-wrap:wrap}
    .btn-primary,.btn-secondary{flex:1 1 100%;box-sizing:border-box}
    /* Nada puede empujar la página a lo ancho */
    body{overflow-x:hidden}
  }
  @media (max-width:560px){
    .rg-hero,.rg-trust,.rg-featured,.rg-steps,.rg-sheets,.rg-packages,.rg-resources,
    .rg-leadmagnet,.rg-problem,.rg-membership,.rg-cart,.rg-checkout,.rg-checkout-fields,
    .rg-catalog-grid,.rg-pkg-cards,.rg-mockup-stats,.nmx-hero,.nmx-body,.nmx-meta,
    .doc-grid,.doc-kpis,.doc-phases,.doc-split,.hiw-steps,.hiw-sheets,.hiw-split{
      grid-template-columns:1fr !important
    }
    /* Grillas con medidas fijas declaradas inline */
    [style*="1.5fr 1fr"],[style*="1.4fr 1fr"],[style*="1.6fr 1fr"],[style*="1.05fr 1fr"],
    [style*="1.4fr 1fr 1fr 1fr 1fr"],[style*="repeat(3,1fr)"],[style*="repeat(4,1fr)"],
    [style*="repeat(5,1fr)"]{grid-template-columns:1fr !important}
    .section{padding-left:16px !important;padding-right:16px !important}
    div[style*="px 40px"]{padding-inline:16px !important}
  }
</style>
</helmet>

<dc-import name="Header" active="recursos" cart-count="2" hint-size="100%,64px"></dc-import>

<div style="max-width:1280px;margin:0 auto;padding:44px 40px 8px">
  <div class="mono" style="color:#ff8f62;font-size:11px;margin-bottom:12px">// CONOCE LA CALIDAD ANTES DE COMPRAR</div>
  <h1 style="font-size:28px;font-weight:800;margin:0 0 10px;letter-spacing:-.4px">Recursos gratuitos</h1>
  <p style="font-size:14.5px;color:#9fb8ae;max-width:600px;margin:0 0 32px">Plantillas simples de ejemplo, sin costo, para conocer el estándar Excel Lab.</p>
</div>

<div style="max-width:1280px;margin:0 auto;padding:0 40px 72px">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;max-width:680px">
    <sc-for list="{{ resources }}" as="r" hint-placeholder-count="2">
      <div style="border:1px solid rgba(110,231,183,.16);border-radius:8px;overflow:hidden;display:flex;flex-direction:column">
        <div style="height:110px;overflow:hidden">
          <img src="{{ r.cover }}" alt="{{ r.name }}" style="width:100%;height:100%;object-fit:cover"/>
        </div>
        <div style="padding:18px;display:flex;flex-direction:column;gap:8px;flex:1">
          <span class="mono" style="width:fit-content;font-size:10px;background:rgba(110,231,183,.12);color:#6ee7b7;padding:3px 8px;border-radius:3px">GRATIS</span>
          <div style="font-weight:800;font-size:14.5px">{{ r.name }}</div>
          <div style="font-size:12.5px;color:#9fb8ae;line-height:1.5;flex:1">{{ r.desc }}</div>
          <a href="{{ r.href }}" download="{{ r.download }}" style="text-decoration:none;margin-top:8px;text-align:center;padding:10px;background:#6ee7b7;color:#04140f;border:none;border-radius:6px;font-weight:700;font-size:13px">Descargar gratis</a>
        </div>
      </div>
    </sc-for>
  </div>
</div>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      resources: [
        // Descarga directa: antes esto abría un embudo de tres páginas
        // (detalle → registro → acceso) para entregar dos archivos gratuitos.
        {name:'Plantilla gratuita de ejemplo', desc:'Vista simplificada del formato Excel Lab: entradas, cálculo y resultados en una hoja.', cover:'assets/img/covers/excel-lab-demo.png', href:'assets/free/plantilla-excel-lab-demo.xlsx', download:'Plantilla-Excel-Lab-demo.xlsx'},
        {name:'Checklist para consulta nutricional', desc:'Lista de verificación previa a cada sesión, en el mismo formato.', cover:'assets/img/covers/checklist-consulta.png', href:'assets/free/checklist-consulta-nutricional.xlsx', download:'Checklist-consulta-nutricional.xlsx'}
      ]
    };
  }
}

</script>
</body>
</html>
