<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Manrope',system-ui,sans-serif;color:#e2e8f0}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;font-weight:700;color:#c7dad2}
  .field input{padding:11px 14px;border:1px solid rgba(110,231,183,.25);border-radius:6px;font-size:13.5px;font-family:'Manrope',sans-serif;background:rgba(255,255,255,.04);color:#e2e8f0}
</style>
</helmet>
<script src="./store.js"></script>

<dc-import name="Header" active="" cart-count="2" hint-size="100%,64px"></dc-import>

<div style="max-width:420px;margin:0 auto;padding:64px 40px 100px">
  <div style="text-align:center;margin-bottom:28px">
    <h1 style="font-size:24px;font-weight:800;margin:0 0 8px;letter-spacing:-.3px">Recuperar contraseña</h1>
    <p style="font-size:13.5px;color:#9fb8ae;margin:0">Te enviaremos un enlace para restablecerla.</p>
  </div>
  <sc-if value="{{ !sent }}" hint-placeholder-val="{{ true }}">
    <form onSubmit="{{ onSubmit }}" style="display:flex;flex-direction:column;gap:16px">
      <div class="field"><label for="femail">Correo electrónico</label><input id="femail" type="email" placeholder="tucorreo@ejemplo.com" value="{{ email }}" onChange="{{ onEmailChange }}"/></div>
      <sc-if value="{{ errorMsg }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:12.5px;color:#ff6b5e;font-weight:600">{{ errorMsg }}</div>
      </sc-if>
      <button type="submit" disabled="{{ submitting }}" style="text-decoration:none;text-align:center;padding:13px;background:#6ee7b7;color:#04140f;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;border:none;font-family:'Manrope',sans-serif;opacity:{{ submitOpacity }}">{{ submitLabel }}</button>
    </form>
  </sc-if>
  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
    <div style="border:1px solid rgba(110,231,183,.25);border-radius:8px;padding:22px;background:rgba(110,231,183,.06);text-align:center">
      <div style="color:#6ee7b7;font-weight:800;font-size:15px;margin-bottom:6px">Revisa tu correo</div>
      <p style="font-size:13px;color:#c7dad2;margin:0;line-height:1.6">Si existe una cuenta con ese correo, te enviamos un enlace para restablecer tu contraseña. También revisa spam.</p>
    </div>
  </sc-if>
  <p style="font-size:12.5px;color:#8fa9a0;text-align:center;margin-top:22px"><a href="Login.dc.html">Volver a iniciar sesión</a></p>
</div>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', errorMsg: '', submitting: false, sent: false };

  async _submit(e) {
    if (e && e.preventDefault) e.preventDefault();
    const email = (this.state.email || '').trim();
    if (!email) { this.setState({ errorMsg: 'Ingresa tu correo.' }); return; }
    this.setState({ submitting: true, errorMsg: '' });
    try {
      await window.NMXStore.forgotPassword(email);
      this.setState({ submitting: false, sent: true });
    } catch (err) {
      this.setState({ submitting: false, errorMsg: (err && err.message) || 'No se pudo enviar el enlace.' });
    }
  }

  renderVals() {
    const s = this.state;
    return {
      email: s.email,
      onEmailChange: (e) => this.setState({ email: e.target.value }),
      errorMsg: s.errorMsg,
      submitting: s.submitting,
      submitOpacity: s.submitting ? 0.65 : 1,
      submitLabel: s.submitting ? 'Enviando…' : 'Enviar enlace',
      sent: s.sent,
      onSubmit: (e) => this._submit(e)
    };
  }
}
</script>
</body>
</html>
