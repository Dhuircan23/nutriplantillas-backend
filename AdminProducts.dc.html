<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="./store.js"></script>
<style>
  body{margin:0;background:radial-gradient(ellipse 1200px 700px at 50% -8%,#0d3226 0%,#0a251c 42%,#04140f 78%,#030f0b 100%) fixed;font-family:'Inter Tight',system-ui,sans-serif;color:#e2e8f0;position:relative}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(110,231,183,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,183,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse 1400px 900px at 50% 0%,#000 40%,transparent 85%)}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 520px at 88% 12%,rgba(16,185,129,.13),transparent 70%),radial-gradient(circle 460px at 6% 78%,rgba(255,122,69,.08),transparent 70%)}
  body > *{position:relative;z-index:1}
  a{color:#6ee7b7} a:hover{color:#9ff4d1}
  .mono{font-family:'JetBrains Mono',monospace}

  /* ---- Responsive móvil (no afecta escritorio) ---- */
  img,svg,canvas,video{max-width:100%;height:auto}
  @media (max-width:900px){
    /* Cualquier tabla ancha scrollea dentro de su caja en vez de estirar la página */
    div:has(> [role="table"]){overflow-x:auto;-webkit-overflow-scrolling:touch}
    /* Paneles admin/cliente: la barra lateral pasa arriba */
    [style*="grid-template-columns:220px 1fr"]{grid-template-columns:1fr !important}
    [style*="grid-template-columns:220px 1fr"] > div:first-child{padding:14px 16px !important}
  }
  @media (max-width:640px){
    /* 40px de margen lateral se comen un cuarto de una pantalla de 320px */
    .section{padding-left:20px !important;padding-right:20px !important;padding-top:44px !important;padding-bottom:44px !important}
    body > div[style*="margin:0 auto"]{padding-left:20px !important;padding-right:20px !important}
    body > div[style*="margin:0 auto"] > div[style*="padding"]{padding-left:0 !important;padding-right:0 !important}
    h1{font-size:clamp(26px,7.4vw,34px) !important;line-height:1.18 !important}
    h2{font-size:clamp(20px,5.4vw,24px) !important}
    /* Objetivos táctiles cómodos */
    button,[role="button"],.btn-primary,.btn-secondary{min-height:44px}
    /* CTA a ancho completo: dos botones lado a lado no caben bien */
    .btn-primary,.btn-secondary{width:100%;box-sizing:border-box}
  }
  @media (max-width:560px){
    /* Toda grilla conocida pasa a una columna */
    .rg-hero,.rg-trust,.rg-featured,.rg-steps,.rg-sheets,.rg-packages,.rg-resources,
    .rg-leadmagnet,.rg-problem,.rg-membership,.rg-cart,.rg-checkout,.rg-checkout-fields,
    .rg-catalog-grid,.rg-pkg-cards,.rg-mockup-stats,.nmx-hero,.nmx-body,.nmx-meta,
    .doc-grid,.doc-kpis,.doc-phases,.doc-split,.hiw-steps,.hiw-sheets,.hiw-split{
      grid-template-columns:1fr !important
    }
    .section{padding-left:16px !important;padding-right:16px !important}
    body > div[style*="margin:0 auto"]{padding-left:16px !important;padding-right:16px !important}
  }
</style>
</helmet>

<div style="display:grid;grid-template-columns:220px 1fr;min-height:100vh">
  <div style="background:#04140f;padding:20px 14px">
    <dc-import name="AdminNav" active="productos" hint-size="192px,480px"></dc-import>
  </div>

  <div style="padding:28px 36px 60px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px">
      <h1 style="font-size:24px;font-weight:800;margin:0;letter-spacing:-.3px">Productos</h1>
      <a href="AdminProductEditor.dc.html" style="text-decoration:none;font-size:13px;font-weight:700;padding:10px 18px;background:#6ee7b7;color:#04140f;border-radius:6px">+ Crear producto</a>
    </div>

    <div style="background:rgba(255,255,255,.04);border:1px solid rgba(110,231,183,.16);border-radius:8px;overflow:hidden">
      <div role="table" style="display:flex;flex-direction:column;min-width:960px">
        <div role="row" style="display:grid;grid-template-columns:2.2fr 1.2fr 1fr 0.9fr 1fr 1fr 1.2fr 1.6fr;background:rgba(255,255,255,.03);font-size:11.5px;font-weight:700;color:#c7dad2">
          <div style="padding:12px 16px">Producto</div>
          <div style="padding:12px 16px">Categoría</div>
          <div style="padding:12px 16px">Precio</div>
          <div style="padding:12px 16px">Versión</div>
          <div style="padding:12px 16px">Estado</div>
          <div style="padding:12px 16px">Ventas</div>
          <div style="padding:12px 16px">Actualizado</div>
          <div style="padding:12px 16px">Acciones</div>
        </div>
        <sc-for list="{{ products }}" as="p" hint-placeholder-count="8">
          <div role="row" style="display:grid;grid-template-columns:2.2fr 1.2fr 1fr 0.9fr 1fr 1fr 1.2fr 1.6fr;border-top:1px solid rgba(110,231,183,.12);align-items:center;font-size:12.5px">
            <div style="padding:12px 16px;display:flex;gap:10px;align-items:center">
              <div style="width:34px;height:26px;flex:none;border-radius:4px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03),rgba(255,255,255,.03) 6px,rgba(110,231,183,.06) 6px,rgba(110,231,183,.06) 12px)"></div>
              <span style="font-weight:700">{{ p.name }}</span>
            </div>
            <div style="padding:12px 16px;color:#b7cfc6">{{ p.category }}</div>
            <div style="padding:12px 16px;font-weight:700">{{ p.price }}</div>
            <div style="padding:12px 16px" class="mono">{{ p.version }}</div>
            <div style="padding:12px 16px"><span class="mono" style="font-size:10px;padding:3px 8px;border-radius:3px;background:{{ p.statusBg }};color:{{ p.statusColor }}">{{ p.status }}</span></div>
            <div style="padding:12px 16px" class="mono">{{ p.sales }}</div>
            <div style="padding:12px 16px;color:#8fa9a0" class="mono">{{ p.updated }}</div>
            <div style="padding:12px 16px;display:flex;gap:6px">
              <a href="AdminProductEditor.dc.html" style="text-decoration:none;font-size:11px;font-weight:700;color:#6ee7b7">Editar</a>
              <a href="AdminVersions.dc.html" style="text-decoration:none;font-size:11px;font-weight:700;color:#6ee7b7">Versiones</a>
              <span style="font-size:11px;font-weight:700;color:#8fa9a0;cursor:pointer">Duplicar</span>
              <span style="font-size:11px;font-weight:700;color:#ff6b5e;cursor:pointer">Archivar</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { products: [] };

  async componentDidMount() {
    if (!window.NMXStore) { setTimeout(() => this.componentDidMount(), 30); return; }
    const session = await window.NMXStore.getSession();
    if (!session || session.role !== 'admin') {
      window.location.href = 'Login.dc.html';
      return;
    }
    if (this._nmxAdminMount) this._nmxAdminMount();
    try {
      const products = await window.NMXStore.adminGetProducts();
      this.setState({ loaded: true, products });
    } catch (e) {
      this.setState({ loaded: true, products: [] });
    }
  }

  renderVals() {
    const products = this.state.products.map((p) => ({
      name: p.name,
      category: p.category || '—',
      price: '$' + Number(p.price_clp).toLocaleString('es-CL'),
      version: p.version || '—',
      status: p.active ? 'Disponible' : 'Inactivo',
      statusBg: p.active ? 'rgba(110,231,183,.12)' : 'rgba(255,255,255,.06)',
      statusColor: p.active ? '#6ee7b7' : '#b7cfc6',
      sales: String(p.sales),
      updated: p.updated_label || '—'
    }));
    return { products, isEmpty: this.state.loaded && products.length === 0 };
  }
}

</script>
</body>
</html>
